services:
  db:
    image: postgres:17-alpine
    container_name: catalogo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo_dev
      POSTGRES_DB: catalogo
    ports:
      - '5434:5432'
    volumes:
      - catalogo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catalogo -d catalogo']
      interval: 5s
      timeout: 3s
      retries: 10

  # API en contenedor (opcional): docker compose --profile full up -d --build
  api:
    profiles: ['full']
    build: .
    container_name: catalogo_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://catalogo:catalogo_dev@db:5432/catalogo
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  catalogo_pgdata:
